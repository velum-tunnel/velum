# Satu-satunya sumber kebenaran versi dependensi & plugin (lihat kebijakan versioning proyek).
[versions]
agp = "9.4.0"
compileSdk = "36"
targetSdk = "36"
minSdk = "24"
appcompat = "1.8.0"
activity = "1.9.3"
# Dipakai LANGSUNG oleh VelumInsets (ViewCompat/WindowInsetsCompat). Sebelumnya hanya
# hadir sebagai dependensi transitif — build bisa pecah tanpa kesalahan repo ini bila
# appcompat/activity suatu hari berhenti membawanya. Versi 1.13.0 adalah versi yang
# MEMANG sudah terselesaikan di graph saat ini, jadi mendeklarasikannya tidak mengubah
# satu pun artifact yang terunduh. Bukti POM (diambil dari Google Maven, 2026-09-12):
#   androidx.appcompat:appcompat:1.8.0 -> androidx.core:core 1.13.0 (compile)
#   androidx.activity:activity:1.9.3   -> androidx.core:core 1.13.0 (compile)
#   androidx.security:security-crypto:1.1.0            -> tidak menarik core
#   com.wireguard.android:tunnel:1.0.20260102          -> hanya annotation 1.9.1 + collection 1.5.0
# Sengaja BUKAN 1.17.0/1.19.0 (versi yang tersedia di Maven): menaikkan versi pustaka
# adalah keputusan tersendiri, bukan efek samping dari "deklarasikan apa yang Anda pakai".
core = "1.13.0"
wireguardTunnel = "1.0.20260102"
securityCrypto = "1.1.0"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
wireguard-tunnel = { module = "com.wireguard.android:tunnel", version.ref = "wireguardTunnel" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# Hanya untuk pengujian unit JVM (tidak ikut ke APK).
junit = { module = "junit:junit", version.ref = "junit" }
# org.json di android.jar bisa jadi rintisan di unit test JVM; pakai
# implementasi nyata KHUSUS untuk pengujian (tidak ikut ke APK).
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

# Satu-satunya sumber kebenaran versi dependensi & plugin (lihat AGENTS.md §4).
[versions]
agp = "9.4.1"
compileSdk = "37"
targetSdk = "36"
minSdk = "24"
appcompat = "1.8.0"
activity = "1.13.0"
# Dipakai LANGSUNG oleh VelumInsets (ViewCompat/WindowInsetsCompat). Sebelumnya hanya
# hadir sebagai dependensi transitif — build bisa pecah tanpa kesalahan repo ini bila
# appcompat/activity suatu hari berhenti membawanya. Versi 1.19.0 adalah rilis stabil
# terbaru dan dipasangkan eksplisit agar API yang dipakai aplikasi tetap terjamin.
# Bukti POM dan status rilis diverifikasi dari Google Maven/AndroidX, 2026-09-20:
#   androidx.appcompat:appcompat:1.8.0 -> androidx.core:core 1.19.0 (compile)
#   androidx.activity:activity:1.13.0 -> androidx.core:core 1.19.0 (compile)
#   androidx.security:security-crypto:1.1.0            -> tidak menarik core
#   com.wireguard.android:tunnel:1.0.20260102          -> hanya annotation 1.9.1 + collection 1.5.0
# Versi AndroidX di atas dipilih dari rilis stabil resmi, bukan alpha/beta; dependensi
# yang belum memiliki rilis stabil lebih baru dipertahankan untuk menghindari perubahan
# perilaku yang tidak diperlukan.
core = "1.19.0"
wireguardTunnel = "1.0.20260102"
securityCrypto = "1.1.0"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
wireguard-tunnel = { module = "com.wireguard.android:tunnel", version.ref = "wireguardTunnel" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# Hanya untuk pengujian unit JVM (tidak ikut ke APK).
junit = { module = "junit:junit", version.ref = "junit" }
# org.json di android.jar bisa jadi rintisan di unit test JVM; pakai
# implementasi nyata KHUSUS untuk pengujian (tidak ikut ke APK).
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

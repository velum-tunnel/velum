name: build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Satu job untuk semua verifikasi kode. Sebelumnya assembleDebug, unitTest, dan
  # lint berjalan sebagai tiga job terpisah yang masing-masing mengulang
  # checkout + JDK + Android SDK + Gradle (±1,5 menit per job, tiga kali) dan
  # memakai tiga cache Gradle yang saling terpisah. Digabung, toolchain disiapkan
  # sekali dan tugas berikutnya memakai ulang cache konfigurasi & build yang panas.
  #
  # Urutan sengaja: unit test dulu (paling cepat gagal, paling murah), lalu
  # assembleDebug (pemblokir utama), lalu lint (advisori, tidak boleh menggagalkan
  # job — karena itu `continue-on-error` per-step, bukan per-job).
  verify:
    name: verifikasi (build, tes, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # AAR lokal adalah bagian dari supply chain aplikasi. Verifikasi checksum
      # sebelum Gradle dijalankan agar artifact yang berubah atau korup tidak pernah
      # masuk ke APK. Path pada SHA256SUMS sengaja relatif supaya portable di CI.
      - name: Verifikasi checksum tunnel WireGuard
        run: sha256sum --check third_party/wireguard-tunnel/SHA256SUMS

      # Cegah regresi tap notifikasi: AAR vendor harus menunjuk ke Activity Java
      # stabil, memakai PendingIntent immutable, dan mempertahankan fallback API lama.
      - name: Verifikasi kontrak notifikasi VPN
        run: tools/verify_notification_contract.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` sudah tidak tersedia di repository SDK modern.
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Dijalankan lebih dulu: paling ringan, dan regresi logika (mis. false
      # negative "Belum lewat Velum") harus ketahuan sebelum waktu habis di APK.
      - name: Pengujian unit
        id: unit_test
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Kegagalan tes hanya ada di laporan JUnit; tanpa ini job merah tanpa informasi.
      - name: Laporkan kegagalan tes sebagai anotasi
        if: always()
        run: |
          python3 .github/scripts/anotasikan-tes.py
          if [ -f "$RUNNER_TEMP/test.log" ]; then
            python3 .github/scripts/anotasikan-log.py "$RUNNER_TEMP/test.log"
          fi

      - name: Build debug APK
        if: always() && steps.unit_test.conclusion != 'cancelled'
        id: assemble
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Log tidak bisa dibaca dari sandbox agen (EOF): teruskan error ke anotasi.
      - name: Laporkan error kompilasi sebagai anotasi
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            python3 .github/scripts/anotasikan-log.py "$RUNNER_TEMP/build.log"
          fi

      # Varian preview = konfigurasi rilis (R8 + shrink) dengan tanda tangan debug.
      # Menjalankannya di setiap push membuat R8 teruji terus-menerus: bila sebuah
      # dependensi baru butuh aturan keep, kegagalannya muncul di sini — bukan nanti
      # saat rilis publik, ketika pengguna yang menemukannya.
      - name: Build preview APK (R8 aktif)
        if: always() && steps.assemble.conclusion != 'cancelled'
        id: preview
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assemblePreview 2>&1 | tee "$RUNNER_TEMP/preview.log"

      - name: Laporkan error preview sebagai anotasi
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/preview.log" ]; then
            python3 .github/scripts/anotasikan-log.py "$RUNNER_TEMP/preview.log"
          fi

      # Warning lint tetap advisori, tetapi error lint harus menggagalkan job.
      - name: Lint debug
        id: lint
        if: always() && steps.assemble.conclusion != 'cancelled'
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Tampilkan temuan lint
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            tail -n 150 app/build/reports/lint-results-debug.txt
            {
              echo "## Temuan lint"
              echo '```'
              tail -n 150 app/build/reports/lint-results-debug.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ringkasan (fallback log)
        if: always()
        run: |
          {
            echo "## Hasil verifikasi"
            echo "- Pengujian unit: ${{ steps.unit_test.conclusion }}"
            echo "- Build debug: ${{ steps.assemble.conclusion }}"
            echo "- Build preview (R8): ${{ steps.preview.conclusion }}"
            echo "- Lint (advisori): ${{ steps.lint.conclusion }}"
            echo "- Gradle: $(grep -o 'gradle-[0-9.]*-bin' gradle/wrapper/gradle-wrapper.properties || echo '?')"
            echo "- AGP: $(grep -E '^agp' gradle/libs.versions.toml || echo '?')"
            # Pemecahan per ABI menghasilkan beberapa APK; daftarkan semuanya beserta
            # ukurannya supaya dampak pemecahan terlihat langsung tanpa mengunduh artifact
            # (artifact tidak bisa diunduh dari sandbox agen, lihat AGENTS.md §5).
            # Debug & preview disandingkan agar dampak R8 terbaca sebagai angka.
            echo ""
            echo "| APK | Varian | Ukuran |"
            echo "|---|---|---|"
            for v in debug preview; do
              if compgen -G "app/build/outputs/apk/$v/*.apk" > /dev/null; then
                for f in app/build/outputs/apk/$v/*.apk; do
                  echo "| $(basename "$f") | $v | $(du -h "$f" | cut -f1) |"
                done
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Semua varian ABI diunggah dalam satu artifact. Nama berkas kini mengandung ABI
      # (mis. app-arm64-v8a-debug.apk), jadi path tidak boleh dipatok ke app-debug.apk.
      - name: Unggah APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APK siap pasang untuk uji coba di perangkat nyata: sudah diperkecil R8 seperti
      # rilis, tetapi bertanda tangan kunci debug sehingga tidak butuh keystore.
      - name: Unggah APK preview
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-preview
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error

      # mapping.txt diperlukan untuk memulihkan laporan crash dari APK yang diperkecil;
      # tanpa berkas ini, stack trace preview/rilis tidak terbaca.
      - name: Unggah mapping R8
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mapping-preview
          path: app/build/outputs/mapping/preview/mapping.txt
          if-no-files-found: warn

      - name: Unggah laporan pengujian
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Unggah laporan lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  # Job rilis OPSIONAL (TODO 8): hanya jalan bila maintainer menyiapkan
  # Secrets SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
  # dan variable repository ENABLE_RELEASE_SIGNING=true. Tanpa itu job di-skip.
  release:
    name: assembleRelease (bertanda tangan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    if: vars.ENABLE_RELEASE_SIGNING == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Gunakan paket SDK yang sama dengan job verifikasi.
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Materialisasi keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK bertanda tangan
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Tanpa langkah ini kegagalan penandatanganan LOLOS DIAM-DIAM: signingConfig
      # hanya terpasang bila KEYSTORE_FILE terisi, dan kalau tidak, Gradle tetap
      # menghasilkan APK (tanpa tanda tangan) lalu CI tetap hijau. Cacatnya baru
      # ketahuan ketika pengguna gagal memasang APK — terlalu terlambat.
      #
      # Selain memastikan APK bertanda tangan, langkah ini menolak APK yang
      # tertandatangani kunci DEBUG: kunci debug seragam di semua mesin, jadi
      # siapa pun bisa menerbitkan "pembaruan" palsu untuk aplikasi ini.
      - name: Verifikasi tanda tangan APK rilis
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          {
            echo "## Sidik jari penandatangan"
            echo ""
            echo "| APK | SHA-256 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            nama=$(basename "$f")
            keluaran=$("$APKSIGNER" verify --print-certs "$f")
            echo "== $nama"
            echo "$keluaran"
            if echo "$keluaran" | grep -qi "CN=Android Debug"; then
              echo "::error::$nama ditandatangani kunci DEBUG, bukan kunci rilis."
              exit 1
            fi
            sidik=$(echo "$keluaran" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
            echo "| $nama | \`${sidik:-tidak terbaca}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sidik jari WAJIB sama di setiap rilis; berubah = pengguna tidak bisa memperbarui." >> "$GITHUB_STEP_SUMMARY"

      - name: Ringkasan APK rilis
        if: always()
        run: |
          {
            echo "## APK rilis (bertanda tangan)"
            if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
              echo "| APK | Ukuran |"
              echo "|---|---|"
              for f in app/build/outputs/apk/release/*.apk; do
                echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Beberapa APK per ABI + satu universal; unggah semuanya (lihat splits di
      # app/build.gradle.kts). Pengguna GitHub Releases memilih berkas sendiri.
      - name: Unggah APK rilis
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

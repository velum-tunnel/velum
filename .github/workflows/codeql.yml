name: CodeQL

# Workflow ADVANCED setup — sengaja bukan default setup. Alasannya tercatat di
# bawah supaya tidak ada yang "merapikan" berkas ini dengan menghapus
# `--no-build-cache` dan menciptakan kegagalan yang sama untuk ketiga kalinya.
#
# Default setup memakai `autobuild`, dan autobuild gagal total pada repo ini:
# `gradle/actions/setup-gradle@v6` memulihkan build cache Gradle (repo ini
# mengaktifkan `org.gradle.caching=true`), sehingga tugas kompilasi dilayani
# FROM-CACHE tanpa pernah menjalankan kotlinc. Perekam CodeQL tidak menangkap
# satu pun pemanggilan kompilator, basis datanya kosong, lalu
# `codeql database finalize` berhenti dengan exit 32: "CodeQL could not process
# any code written in Java/Kotlin".
#
# Bukti waktunya (PR #20, kode identik, hanya beda hangatnya cache):
#   run 34794083803 — autobuild 2m46s  → analisis lolos
#   run 34796094271 — autobuild 33 detik → exit 32
# Autobuild yang rampung dalam 33 detik pada proyek Android berarti tidak ada
# yang dikompilasi.
#
# Karena itu perintah build ditulis eksplisit di sini, dan `--no-build-cache`
# adalah kuncinya: ia mematikan penyajian tugas dari cache, sehingga kompilator
# benar-benar berjalan dan CodeQL melihat kodenya.
#
# PENTING: nonaktifkan default setup di Settings → Code security sebelum
# workflow ini diaktifkan. Bila keduanya berjalan, analisisnya dobel.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analisis CodeQL (java-kotlin)
    # Pin runner agar migrasi label ubuntu-latest tidak mengubah toolchain analisis.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      # init HARUS sebelum langkah build: ia memasang perekam CodeQL di dalam
      # proses Gradle, dan perekam hanya menangkap kompilasi yang terjadi
      # sesudahnya. Menaruh init setelah build menghasilkan basis data kosong
      # lagi — gejalanya sama persis dengan autobuild yang gagal.
      - name: Inisialisasi CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      # Toolchain diidentikkan dengan build.yml, agar yang dianalisis persis
      # kode yang dikompilasi oleh job `verifikasi`. Beda versi JDK bisa
      # menghasilkan artefak yang tidak sama dengan yang dirilis.
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `tools` sudah tidak tersedia di repository SDK modern; CodeQL hanya
          # memerlukan platform dan build tools untuk kompilasi yang direkam.
          packages: "platform-tools platforms;android-37.2 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `--no-build-cache` sengaja dan tidak boleh dihapus: tanpanya tugas
      # dilayani FROM-CACHE dan CodeQL tidak melihat kode apa pun (lihat catatan
      # di kepala berkas). `assembleDebug` dipilih karena paling murah di antara
      # tugas yang benar-benar mengompilasi Kotlin.
      - name: Kompilasi untuk CodeQL
        run: ./gradlew --no-daemon --stacktrace assembleDebug --no-build-cache

      - name: Analisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

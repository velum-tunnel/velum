# Pembaruan versi otomatis. Sumber kebenaran versi tetap gradle/libs.versions.toml
# (lihat kebijakan versioning proyek) — Dependabot hanya membuka PR, manusia yang memutuskan.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
